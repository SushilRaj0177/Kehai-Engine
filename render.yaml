# Render Blueprint — deploys the database and API in one pass. The web
# frontend is deployed separately on Vercel (see README "Deployment"),
# which handles Next.js natively with no Docker involved.
#
# In the Render dashboard: New + -> Blueprint -> connect this repo.
#
# NOTE ON THE FREE PLAN: Render's free Postgres instances are deleted after
# 90 days. That's a deliberate tradeoff for now — see the "Support this
# project" note planned for the README/UI (a donation prompt explaining
# that a paid database plan is what keeps people's data from expiring).
# Upgrading the `postgres` plan below to `starter` (or higher) removes the
# 90-day expiry.

databases:
  - name: kehai-engine-db
    databaseName: kehai_engine
    user: kehai
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: kehai-engine-api
    runtime: docker
    dockerfilePath: apps/server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kehai-engine-db
          property: connectionString
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false # set to your Vercel frontend URL in the Render dashboard once it's deployed
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SIGNING_PEPPER
        generateValue: true
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false # optional — set in the Render dashboard to enable AI features (free at console.groq.com/keys)
      - key: GOOGLE_CLIENT_ID
        sync: false # optional — set in the Render dashboard to enable Google sign-in
