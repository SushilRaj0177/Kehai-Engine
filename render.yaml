# Render Blueprint — deploys the API. The database is NOT provisioned here
# (see below), and the web frontend is deployed separately on Vercel (see
# README "Deployment"), which handles Next.js natively with no Docker
# involved.
#
# In the Render dashboard: New + -> Blueprint -> connect this repo.
#
# DATABASE: this used to also provision a free Render Postgres instance
# here, wired up automatically. Render's free Postgres plan is deleted
# after 90 days with no way to keep it alive short of upgrading to a paid
# plan, so a project that just wants a database that doesn't quietly
# expire is better served by Supabase or Neon's free Postgres tiers
# instead (both are plain Postgres underneath — Prisma doesn't care who's
# hosting it). Create a database there, then set DATABASE_URL below to its
# connection string in the Render dashboard. If you'd rather use Render's
# own Postgres anyway, add a `databases:` block back (see git history) and
# upgrade its plan from `free` to `starter` to avoid the same expiry.

services:
  - type: web
    name: kehai-engine-api
    runtime: docker
    dockerfilePath: apps/server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # set to your Postgres connection string (e.g. from Supabase or Neon) in the Render dashboard
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false # set to your Vercel frontend URL in the Render dashboard once it's deployed
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SIGNING_PEPPER
        generateValue: true
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false # optional — set in the Render dashboard to enable AI features (free at console.groq.com/keys)
      - key: GOOGLE_CLIENT_ID
        sync: false # optional — set in the Render dashboard to enable Google sign-in
