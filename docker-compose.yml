services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kehai
      POSTGRES_PASSWORD: kehai
      POSTGRES_DB: kehai_engine
    ports:
      - "5432:5432"
    volumes:
      - kehai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kehai -d kehai_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kehai:kehai@postgres:5432/kehai_engine?schema=public
      PORT: 4000
      NODE_ENV: production
      WEB_ORIGIN: http://localhost:3000
      # No insecure fallback on purpose: these sign every access token,
      # refresh token, and QR check-in token. A default here that "just
      # works" would mean anyone who reads this public repo could forge
      # tokens against a deployment that forgot to override it. Leaving
      # the var unset makes the server refuse to start (env.ts requires
      # >=16/>=8 chars) with a clear error, instead of booting "production"
      # mode on a known secret.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET before starting (e.g. in a .env file) — see README}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET before starting (e.g. in a .env file) — see README}
      QR_SIGNING_PEPPER: ${QR_SIGNING_PEPPER:?Set QR_SIGNING_PEPPER before starting (e.g. in a .env file) — see README}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # Read at runtime (not baked into the build) — must be reachable from
      # the *browser*, not just the Docker network, since API calls happen
      # client-side. That's why this is localhost:4000, not http://server:4000.
      API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  kehai_pg_data:
